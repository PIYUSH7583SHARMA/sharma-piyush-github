
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="description"
    content="Contact Explore Maharashtra for information about tourism and famous places.">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;

        header {

            color: white;

        }

        nav {
            background-color: #0d47a1;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            background-color: white;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            color: #1565c0;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background-color: #1565c0;
            color: white;

<body>

<header>
    <h1>Contact Us</h1>
    <p>We would love to hear from you</p>
</header>

<nav>
    <a href="new.html">Home</a>
    <a href="former.html">About</a>
    <a href="old.html">Contact</a>
</nav>

<main>

    <h2>Get in Touch</h2>

    <p>
        If you want to know more about Maharashtra,
        you can contact us using the form below.
    </p>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Message:</label>
        <textarea rows="5"
        placeholder="Enter your message"></textarea>

        <button type="submit">Send Message</button>

    </form>

</main>

<footer>
    <p>© 2026 Explore Maharashtra</p>
</footer>
